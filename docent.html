<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 도슨트 — 아트한스푼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --paper: #faf6ee; --ink: #221b14; --ink-2: #6b5c48; --amber: #b9792f; }
  * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font-family: Pretendard, system-ui, sans-serif; line-height: 1.6; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 18px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); padding: 6px 0 14px; }
  header b { font-family: 'Noto Serif KR', serif; color: var(--ink); font-size: 16px; }
  .ex { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 700; line-height: 1.3; margin: 6px 0 2px; }
  .meta { font-size: 13px; color: var(--ink-2); margin-bottom: 18px; }
  .work { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(60,40,10,.08); margin-bottom: 16px; }
  .work img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #eee; }
  .work .b { padding: 16px 18px 18px; }
  .work h2 { font-family: 'Noto Serif KR', serif; font-size: 19px; margin: 0 0 4px; }
  .work .m { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
  .work p { margin: 0 0 12px; font-size: 15px; }
  .pl { display: flex; align-items: center; gap: 10px; border: 1px solid #e3d9c8; border-radius: 999px; padding: 10px 14px; font-size: 14px; cursor: pointer; background: #fff; width: 100%; font: inherit; }
  .pl i { width: 30px; height: 30px; border-radius: 50%; background: var(--amber); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12px; }
  .ask { display: block; text-align: center; margin-top: 8px; border: 1px solid var(--amber); color: var(--amber); border-radius: 999px; padding: 10px; text-decoration: none; font-weight: 600; font-size: 14px; }
  .all a { display: block; color: inherit; text-decoration: none; }
  .foot { font-size: 12px; color: var(--ink-2); margin-top: 24px; text-align: center; }
  .edit { position: fixed; right: 14px; bottom: 14px; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 10px 14px; font-size: 12px; opacity: .85; }
</style>
</head>
<body>
<div class="wrap">
  <header><b>아트한스푼</b><span>골목 끝 카페 · 11.14 – 11.28</span></header>
  <div class="ex" id="exTitle">저녁의 색 — 김하늘 · 박도윤 · 이서연</div>
  <div class="meta">동네 카페 팝업 전시 · 작품 옆 QR로 각 작품 설명을 볼 수 있어요</div>
  <div id="list"></div>
  <p class="foot">작가가 직접 쓴 설명입니다. 구매·대여 문의는 각 작품의 버튼으로 운영자에게 전달됩니다.<br>아트한스푼 QR 도슨트 (시안)</p>
</div>
<button class="edit" type="button" onclick="alert('작가 편집 화면(데모): 작품 설명·음성·순서를 작가 계정에서 직접 고칩니다.')">작가 편집 모드</button>
<script>
  const WORKS = [
    { id: 1, t: '저녁 언덕', a: '김하늘', m: '캔버스에 유채 · 2026 · 41×32cm', img: 'assets/img/art-1.webp', p: '퇴근길 버스 창밖으로 본 언덕의 색을 기억하려고 그렸어요. 해가 지기 직전 분홍과 청록이 겹치는 몇 분을 두꺼운 붓질로 남겼습니다.', au: '0:48' },
    { id: 2, t: '골목의 밤', a: '박도윤', m: '종이에 과슈 · 2026 · 30×24cm', img: 'assets/img/art-2.webp', p: '우리 동네 골목 끝 카페. 불 켜진 창문 하나가 골목 전체를 따뜻하게 만든다는 걸 그리고 싶었어요.', au: '0:35' },
    { id: 3, t: '앉은 사람들', a: '이서연', m: '종이에 잉크·수채 · 2026 · 21×29cm', img: 'assets/img/art-3.webp', p: '카페에 앉은 사람들을 선 몇 개로. 얼굴은 비워 두었어요. 보는 분이 아는 사람을 떠올리도록.', au: '0:41' },
  ];
  const w = new URLSearchParams(location.search).get('w');
  const list = WORKS.filter(x => !w || String(x.id) === w);
  document.getElementById('list').innerHTML = list.map(x => `
    <article class="work" id="w${x.id}">
      <img src="${x.img}" alt="${x.t}">
      <div class="b"><h2>${x.t}</h2><div class="m">${x.a} · ${x.m}</div><p>${x.p}</p>
        <button class="pl" type="button" onclick="this.querySelector('i').textContent = this.querySelector('i').textContent==='▶'?'❚❚':'▶'"><i>▶</i>작가 음성 설명 · ${x.au} (시안: 음성 파일 연결 예정)</button>
        <a class="ask" href="#" onclick="alert('구매·대여 문의(데모): 운영자에게 전달됩니다.');return false;">이 작품 문의하기</a></div>
    </article>`).join('') + (w ? `<div class="all"><a href="docent.html">← 전시 전체 보기</a></div>` : '');
  if (w && list[0]) document.getElementById('exTitle').textContent = `${list[0].t} — ${list[0].a}`;
</script>
</body>
</html>
